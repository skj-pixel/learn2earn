<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>杭州创业大赛评分增强看板</title>
  <style>
    :root { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #14213d; background: #f7f8fb; }
    body { margin: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    h2 { font-size: 20px; margin: 24px 0 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: #fff; border: 1px solid #dfe5ef; border-radius: 8px; padding: 16px; box-shadow: 0 4px 18px rgba(20,33,61,.06); }
    textarea, input { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; font-size: 14px; line-height: 1.55; }
    textarea { min-height: 150px; resize: vertical; }
    button { border: 0; border-radius: 6px; background: #1f6feb; color: #fff; padding: 10px 14px; font-size: 15px; cursor: pointer; }
    button.secondary { background: #0f766e; }
    .score { font-size: 42px; font-weight: 700; color: #0f766e; }
    .bar { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 10px; margin: 10px 0; }
    .track { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg,#0f766e,#1f6feb); }
    .rubric { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .rubric div { background: #eef6ff; border-left: 4px solid #1f6feb; padding: 10px; border-radius: 6px; }
    pre { white-space: pre-wrap; background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; min-height: 160px; }
    @media (max-width: 820px) { .grid, .rubric { grid-template-columns: 1fr; } main { padding: 18px; } }
  </style>
</head>
<body>
<main>
  <h1>杭州创业大赛评分增强看板</h1>
  <p id="projectIntro"></p>

  <section class="panel">
    <h2>评分标准</h2>
    <div class="rubric" id="rubric"></div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>输入与产物</h2>
      <label>用户输入 / 场景需求</label>
      <textarea id="userInput">请为本项目生成一个面向杭州创业大赛评委的行业场景 Demo。</textarea>
      <label>Agent 输出 / 交互产物</label>
      <textarea id="agentOutput">目标用户、痛点、输入、步骤、输出、证据、下一步；理解、计划、执行、验证、交付；数据来源、风险边界、导出模板。</textarea>
      <label>可观察执行链</label>
      <textarea id="trace">日志：读取资料、生成计划、调用工具、校验结果、导出报告。</textarea>
      <p>
        <button id="evaluateBtn">评估产物质量</button>
        <button class="secondary" id="promptBtn">生成高分提示词</button>
      </p>
    </div>
    <div class="panel">
      <h2>评估结果</h2>
      <div class="score"><span id="total">0</span>/100</div>
      <div id="bars"></div>
      <h2>改进建议</h2>
      <ul id="suggestions"></ul>
    </div>
  </section>

  <section class="panel">
    <h2>高分提示词模板</h2>
    <pre id="promptOut"></pre>
  </section>
</main>
<script src="./project_meta.js"></script>
<script>
const RUBRIC = [
  ["行业场景价值", 25, "真实行业问题、目标用户、核心痛点、现实收益、复制推广潜力"],
  ["Agent 能力与任务闭环", 25, "理解、规划、工具调用、知识增强、上下文记忆、验证交付"],
  ["产品体验与 Demo 完成度", 20, "自然交互、清晰流程、及时反馈、稳定可运行、快速验证"],
  ["技术实现深度", 15, "大模型、Agent、知识库、工具、多模态、工作流、工程架构"],
  ["安全、合规与可追溯", 10, "数据来源、使用边界、风险提示、审计记录、合规约束"],
  ["开放 / 复用贡献", 5, "模板、示例数据、文档、复用接口、开源计划、依赖说明"],
];
const CHECKS = {
  structure: ["目标用户", "痛点", "输入", "步骤", "输出", "证据", "下一步"],
  agentLoop: ["理解", "计划", "执行", "验证", "交付"],
  evidence: ["数据来源", "依据", "引用", "日志", "截图", "结果"],
  safety: ["风险", "边界", "合规", "人工确认", "免责声明"],
  reuse: ["模板", "示例", "导出", "复用", "接口"],
};
function hitCount(text, words) {
  return words.filter((word) => text.toLowerCase().includes(word.toLowerCase())).length;
}
function evaluateInteractionArtifact(userInput, agentOutput, trace = "") {
  const text = `${userInput || ""}\n${agentOutput || ""}\n${trace || ""}`;
  const structureHits = hitCount(text, CHECKS.structure);
  const agentHits = hitCount(text, CHECKS.agentLoop);
  const evidenceHits = hitCount(text, CHECKS.evidence);
  const safetyHits = hitCount(text, CHECKS.safety);
  const reuseHits = hitCount(text, CHECKS.reuse);
  const lengthBonus = Math.min((agentOutput || "").length / 1200, 1);
  const scores = {
    "行业场景价值": Math.min(25, +(8 + structureHits * 2.2 + lengthBonus * 4).toFixed(1)),
    "Agent 能力与任务闭环": Math.min(25, +(7 + agentHits * 3.0 + evidenceHits * 0.8).toFixed(1)),
    "产品体验与 Demo 完成度": Math.min(20, +(7 + structureHits * 1.3 + (text.includes("导出") ? 2 : 0) + (text.includes("反馈") ? 2 : 0)).toFixed(1)),
    "技术实现深度": Math.min(15, +(5 + hitCount(text, ["模型", "知识库", "工具", "工作流", "多轮", "多模态", "架构"]) * 1.4).toFixed(1)),
    "安全、合规与可追溯": Math.min(10, +(2 + safetyHits * 1.6 + evidenceHits * 0.7).toFixed(1)),
    "开放 / 复用贡献": Math.min(5, +(1 + reuseHits * 0.8).toFixed(1)),
  };
  const suggestions = [];
  if (structureHits < 4) suggestions.push("补充目标用户、痛点、输入、步骤、输出、证据和下一步。");
  if (agentHits < 4) suggestions.push("展示 Agent 从理解、计划、执行、验证到交付的闭环。");
  if (evidenceHits < 3) suggestions.push("为关键结论增加数据来源、引用、日志、截图或验证结果。");
  if (safetyHits < 2) suggestions.push("补充风险边界、合规提示和需要人工确认的场景。");
  if (reuseHits < 2) suggestions.push("补充模板、示例数据、导出格式或 API/工作流复用说明。");
  return { total: Object.values(scores).reduce((a, b) => +(a + b).toFixed(1), 0), scores, suggestions, rubric: RUBRIC };
}
function buildImprovedPrompt(rawPrompt, scenario = "") {
  return `请围绕杭州创业大赛评分标准完成任务。

行业场景：${scenario || "请先识别最匹配的真实行业场景"}
用户原始需求：${rawPrompt}

输出要求：
1. 明确目标用户、真实痛点、业务收益和可推广性。
2. 展示 Agent 的理解、计划、执行、验证、交付闭环。
3. 给出结构化产物，并说明数据来源、证据、使用边界和风险提示。
4. 给出可复用模板、示例数据、导出形式和下一步行动。
5. 最后用 6 个杭州赛评分维度自评，并说明如何继续提升。`;
}

const meta = window.PROJECT_META || {
  name: "杭州创业大赛增强项目",
  scenario: "围绕真实行业问题构建 Agent 闭环 Demo"
};
document.getElementById("projectIntro").textContent = `${meta.name}：${meta.scenario}`;

const rubricEl = document.getElementById("rubric");
evaluateInteractionArtifact("", "", "").rubric.forEach(([name, weight, desc]) => {
  const node = document.createElement("div");
  node.innerHTML = `<strong>${name}（${weight}%）</strong><br>${desc}`;
  rubricEl.appendChild(node);
});

function render() {
  const result = evaluateInteractionArtifact(
    document.getElementById("userInput").value,
    document.getElementById("agentOutput").value,
    document.getElementById("trace").value
  );
  document.getElementById("total").textContent = result.total.toFixed(1);
  const bars = document.getElementById("bars");
  bars.innerHTML = "";
  Object.entries(result.scores).forEach(([name, value]) => {
    const max = name.includes("25") ? 25 : name.includes("20") ? 20 : name.includes("15") ? 15 : name.includes("10") ? 10 : 5;
    const actualMax = name === "行业场景价值" || name === "Agent 能力与任务闭环" ? 25 : name === "产品体验与 Demo 完成度" ? 20 : name === "技术实现深度" ? 15 : name === "安全、合规与可追溯" ? 10 : 5;
    const row = document.createElement("div");
    row.className = "bar";
    row.innerHTML = `<span>${name}</span><span class="track"><span class="fill" style="display:block;width:${Math.min(100, value / actualMax * 100)}%"></span></span><strong>${value}/${actualMax}</strong>`;
    bars.appendChild(row);
  });
  const suggestions = document.getElementById("suggestions");
  suggestions.innerHTML = "";
  (result.suggestions.length ? result.suggestions : ["当前产物已经覆盖主要评分要点，可以进入 Demo 录制和材料打磨。"]).forEach((item) => {
    const li = document.createElement("li");
    li.textContent = item;
    suggestions.appendChild(li);
  });
}

document.getElementById("evaluateBtn").addEventListener("click", render);
document.getElementById("promptBtn").addEventListener("click", () => {
  document.getElementById("promptOut").textContent = buildImprovedPrompt(document.getElementById("userInput").value, meta.scenario);
});
render();
</script>
</body>
</html>
